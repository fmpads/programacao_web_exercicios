<!DOCTYPE html>
<html lang="pt-br">
<head> <!-- tag de abertura de cabeçalho -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09/09/2026 - 15 tags - Exercício</title> <!-- tag de título -->
</head>
<body> <!-- tag de abertura do corpo -->
    <h1>Exercício 15 tags</h1> <!-- tag de título principal -->
    <p>Este é um parágrafo de exemplo.</p> <!-- tag de parágrafo -->
    <a href="https://www.exemplo.com">Link para exemplo</a> <!-- tag de link -->
    <img src="https://avatars.githubusercontent.com/u/311097994?v=4" alt="Imagem do usuário"> <!-- tag de imagem -->
    <figcaption>Imagem do usuário</figcaption>
    <ul> <!-- tag de lista não ordenada -->
        <li>Item 1</li> <!-- tag de item de lista -->
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol> <!-- tag de lista ordenada -->
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
    </ol>
    <table> <!-- tag de tabela -->
        <tr> <!-- tag de linha da tabela -->
            <th>Cabeçalho 1</th> <!-- tag de cabeçalho da tabela -->
            <th>Cabeçalho 2</th>
        </tr>
        <tr>
            <td>Dado 1</td> <!-- tag de célula da tabela -->
            <td>Dado 2</td>
        </tr>
    </table>
    
</body>
</html>
